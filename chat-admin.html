<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LFT Chat Admin</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0c10;
  --panel:#111318;
  --panel2:#161b22;
  --border:#21262d;
  --accent:#1a73e8;
  --accent2:#0d47a1;
  --green:#2ea043;
  --red:#da3633;
  --yellow:#d29922;
  --text:#e6edf3;
  --text2:#8b949e;
  --text3:#484f58;
  --font:'Syne',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow:hidden;}

/* LOGIN */
#login-screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:100;
  background-image:radial-gradient(ellipse at 20% 50%,rgba(26,115,232,.08) 0%,transparent 60%),
                   radial-gradient(ellipse at 80% 20%,rgba(13,71,161,.06) 0%,transparent 50%);
}
.login-box{
  width:360px;padding:40px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
}
.login-logo{
  font-size:13px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--text2);font-family:var(--mono);margin-bottom:32px;
  display:flex;align-items:center;gap:10px;
}
.login-logo span{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 12px var(--accent);
}
.login-box h1{font-size:28px;font-weight:800;margin-bottom:6px;line-height:1.1;}
.login-box p{color:var(--text2);font-size:14px;margin-bottom:32px;}
.login-box label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:8px;font-family:var(--mono);}
.login-box input{
  width:100%;padding:12px 16px;
  background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:15px;font-family:var(--font);
  outline:none;transition:border-color .2s;
}
.login-box input:focus{border-color:var(--accent);}
.login-err{color:var(--red);font-size:13px;margin-top:8px;display:none;font-family:var(--mono);}
.login-btn{
  width:100%;margin-top:24px;padding:13px;
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  font-size:15px;font-family:var(--font);font-weight:700;cursor:pointer;
  transition:background .2s,transform .1s;letter-spacing:.02em;
}
.login-btn:hover{background:var(--accent2);}
.login-btn:active{transform:scale(.98);}

/* MAIN LAYOUT */
#app{display:none;height:100vh;flex-direction:column;}
#app.active{display:flex;}

/* TOP BAR */
#topbar{
  height:52px;padding:0 20px;
  background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.tb-left{display:flex;align-items:center;gap:16px;}
.tb-logo{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--text2);}
.tb-logo strong{color:var(--text);}
#status-toggle{
  display:flex;align-items:center;gap:8px;
  padding:6px 14px;border-radius:20px;border:1px solid var(--border);
  background:var(--panel2);cursor:pointer;font-size:13px;font-weight:600;
  transition:all .2s;font-family:var(--mono);
}
#status-toggle .dot{width:8px;height:8px;border-radius:50%;transition:background .3s;}
#status-toggle.online .dot{background:var(--green);box-shadow:0 0 8px var(--green);}
#status-toggle.online{border-color:rgba(46,160,67,.3);}
#status-toggle.offline .dot{background:var(--red);}
#status-toggle.offline{border-color:rgba(218,54,51,.3);}
.tb-right{display:flex;align-items:center;gap:12px;}
#notif-badge{
  background:var(--red);color:#fff;border-radius:20px;
  padding:3px 10px;font-size:12px;font-weight:700;font-family:var(--mono);
  display:none;animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}
#logout-btn{
  padding:6px 14px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--text2);font-size:13px;cursor:pointer;
  font-family:var(--mono);transition:all .2s;
}
#logout-btn:hover{border-color:var(--red);color:var(--red);}

/* MAIN CONTENT */
#main{display:flex;flex:1;overflow:hidden;}

/* SIDEBAR */
#sidebar{
  width:280px;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;
}
.sidebar-hd{
  padding:16px;border-bottom:1px solid var(--border);
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text3);font-family:var(--mono);display:flex;align-items:center;justify-content:space-between;
}
#session-count{
  background:var(--panel2);border:1px solid var(--border);
  color:var(--text2);border-radius:20px;padding:2px 8px;font-size:11px;
}
#sessions-list{flex:1;overflow-y:auto;}
#sessions-list::-webkit-scrollbar{width:4px;}
#sessions-list::-webkit-scrollbar-track{background:transparent;}
#sessions-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.session-item{
  padding:14px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .15s;position:relative;
}
.session-item:hover{background:var(--panel2);}
.session-item.active{background:rgba(26,115,232,.12);border-left:3px solid var(--accent);}
.session-item.has-unread::after{
  content:'';position:absolute;top:14px;right:14px;
  width:8px;height:8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 8px var(--accent);
}
.si-name{font-size:14px;font-weight:700;margin-bottom:3px;}
.si-last{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.si-meta{display:flex;align-items:center;gap:6px;margin-top:5px;}
.si-time{font-size:11px;color:var(--text3);font-family:var(--mono);}
.si-page{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;}
.empty-state{
  padding:40px 20px;text-align:center;color:var(--text3);
}
.empty-state .ico{font-size:36px;margin-bottom:12px;}
.empty-state p{font-size:13px;line-height:1.6;}

/* CHAT AREA */
#chat-area{flex:1;display:flex;flex-direction:column;background:var(--bg);}
#chat-empty{
  flex:1;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;color:var(--text3);
}
#chat-empty .ico{font-size:48px;}
#chat-empty p{font-size:14px;}

#chat-active{flex:1;display:none;flex-direction:column;}
#chat-hd{
  padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.ch-info h3{font-size:16px;font-weight:700;margin-bottom:2px;}
.ch-info p{font-size:12px;color:var(--text2);font-family:var(--mono);}
#close-session-btn{
  padding:6px 14px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--text2);font-size:12px;cursor:pointer;
  font-family:var(--mono);transition:all .2s;
}
#close-session-btn:hover{border-color:var(--red);color:var(--red);}
#chat-msgs{
  flex:1;overflow-y:auto;padding:20px;
  display:flex;flex-direction:column;gap:10px;
}
#chat-msgs::-webkit-scrollbar{width:4px;}
#chat-msgs::-webkit-scrollbar-track{background:transparent;}
#chat-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.msg{max-width:72%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.55;word-break:break-word;}
.msg-visitor{align-self:flex-start;background:var(--panel);border:1px solid var(--border);color:var(--text);}
.msg-admin{align-self:flex-end;background:var(--accent);color:#fff;}
.msg-time{font-size:11px;opacity:.55;display:block;margin-top:5px;font-family:var(--mono);}
.msg-sender{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;opacity:.6;font-family:var(--mono);}

#chat-ft{
  padding:14px 20px;background:var(--panel);border-top:1px solid var(--border);
  display:flex;gap:10px;align-items:flex-end;flex-shrink:0;
}
#admin-inp{
  flex:1;padding:12px 16px;
  background:var(--panel2);border:1px solid var(--border);
  border-radius:12px;color:var(--text);font-size:14px;font-family:var(--font);
  outline:none;resize:none;min-height:44px;max-height:120px;
  transition:border-color .2s;line-height:1.5;
}
#admin-inp:focus{border-color:var(--accent);}
#send-btn{
  width:44px;height:44px;border-radius:10px;
  background:var(--accent);color:#fff;border:none;cursor:pointer;
  font-size:18px;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .1s;flex-shrink:0;
}
#send-btn:hover{background:var(--accent2);}
#send-btn:active{transform:scale(.95);}

/* NOTIFICATION TOAST */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:12px 20px;font-size:14px;z-index:200;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  white-space:nowrap;
}
#toast.show{transform:translateX(-50%) translateY(0);}

@media(max-width:700px){
  #sidebar{width:220px;}
  .si-page{display:none;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><span></span> lovefortechnology.net</div>
    <h1>Chat Admin</h1>
    <p>Είσοδος στο dashboard</p>
    <label>Κωδικός πρόσβασης</label>
    <input type="password" id="pw-input" placeholder="••••••••" onkeypress="if(event.key==='Enter')doLogin()">
    <div class="login-err" id="login-err">❌ Λάθος κωδικός</div>
    <button class="login-btn" onclick="doLogin()">Είσοδος →</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="topbar">
    <div class="tb-left">
      <div class="tb-logo"><strong>LFT</strong> · Chat Admin</div>
      <div id="status-toggle" onclick="toggleStatus()">
        <div class="dot"></div>
        <span id="status-label">...</span>
      </div>
    </div>
    <div class="tb-right">
      <div id="notif-badge">● Νέο μήνυμα</div>
      <button id="logout-btn" onclick="doLogout()">Έξοδος</button>
    </div>
  </div>
  <div id="main">
    <div id="sidebar">
      <div class="sidebar-hd">
        Συνομιλίες
        <span id="session-count">0</span>
      </div>
      <div id="sessions-list">
        <div class="empty-state">
          <div class="ico">💬</div>
          <p>Δεν υπάρχουν<br>ενεργές συνομιλίες</p>
        </div>
      </div>
    </div>
    <div id="chat-area">
      <div id="chat-empty">
        <div class="ico">👈</div>
        <p>Επίλεξε μια συνομιλία</p>
      </div>
      <div id="chat-active">
        <div id="chat-hd">
          <div class="ch-info">
            <h3 id="ch-name">—</h3>
            <p id="ch-page">—</p>
          </div>
          <button id="close-session-btn" onclick="closeSession()">Κλείσιμο session</button>
        </div>
        <div id="chat-msgs"></div>
        <div id="chat-ft">
          <textarea id="admin-inp" rows="1" placeholder="Γράψε απάντηση..." onkeypress="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendReply();}"></textarea>
          <button id="send-btn" onclick="sendReply()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ═══════════════════════════════════════════
// ΡΥΘΜΙΣΕΙΣ — άλλαξε μόνο τον κωδικό
// ═══════════════════════════════════════════
const ADMIN_PASSWORD = 'lft2026admin'; // ← ΑΛΛΑΞΕ ΤΟ

firebase.initializeApp({
  apiKey:"AIzaSyB9TwegsfvoOm41VDyCRVNOGxCeuWLiuP0",
  authDomain:"lovefortechnology-19f7b.firebaseapp.com",
  databaseURL:"https://lovefortechnology-19f7b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"lovefortechnology-19f7b",
  storageBucket:"lovefortechnology-19f7b.firebasestorage.app",
  messagingSenderId:"419943842587",
  appId:"1:419943842587:web:d03164f8b99cf718a9c9be"
});

const db = firebase.database();
let currentSid = null;
let msgsListener = null;
let sessionsListener = null;
let knownMsgCounts = {};
let isOnline = true;

// ── LOGIN ──────────────────────────────────
function doLogin(){
  const v = document.getElementById('pw-input').value;
  if(v === ADMIN_PASSWORD){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').classList.add('active');
    initApp();
  } else {
    const e = document.getElementById('login-err');
    e.style.display='block';
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
    setTimeout(()=>e.style.display='none', 3000);
  }
}
function doLogout(){
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pw-input').value='';
  if(sessionsListener) sessionsListener();
  if(msgsListener) msgsListener();
  currentSid=null;
}

// ── INIT ───────────────────────────────────
function initApp(){
  // Status
  db.ref('chat/status').on('value', snap => {
    isOnline = snap.val() !== false;
    updateStatusUI();
  });
  // Sessions
  sessionsListener = db.ref('chat/sessions').on('value', snap => {
    const data = snap.val() || {};
    renderSessions(data);
    checkNewMessages(data);
  });
}

// ── STATUS ────────────────────────────────
function updateStatusUI(){
  const t = document.getElementById('status-toggle');
  const l = document.getElementById('status-label');
  t.className = isOnline ? 'online' : 'offline';
  l.textContent = isOnline ? 'Online' : 'Offline';
}
function toggleStatus(){
  db.ref('chat/status').set(!isOnline);
}

// ── SESSIONS ──────────────────────────────
function renderSessions(data){
  const list = document.getElementById('sessions-list');
  const keys = Object.keys(data).filter(k=>data[k].active!==false);
  document.getElementById('session-count').textContent = keys.length;

  if(!keys.length){
    list.innerHTML = `<div class="empty-state"><div class="ico">💬</div><p>Δεν υπάρχουν<br>ενεργές συνομιλίες</p></div>`;
    return;
  }

  // Sort by lastActivity desc
  keys.sort((a,b)=> (data[b].lastActivity||0)-(data[a].lastActivity||0));

  list.innerHTML = keys.map(sid => {
    const s = data[sid];
    const time = s.lastActivity ? fmtTime(s.lastActivity) : '';
    const isActive = sid===currentSid ? 'active' : '';
    const msgs = s.messages ? Object.values(s.messages) : [];
    const hasUnread = msgs.some(m=>m.sender==='visitor'&&!m.seen) ? 'has-unread':'';
    return `<div class="session-item ${isActive} ${hasUnread}" onclick="openSession('${sid}')">
      <div class="si-name">${esc(s.visitorName||'Επισκέπτης')}</div>
      <div class="si-last">${esc(s.lastMessage||'—')}</div>
      <div class="si-meta">
        <span class="si-time">${time}</span>
        <span class="si-page">${esc(s.page||'')}</span>
      </div>
    </div>`;
  }).join('');
}

function checkNewMessages(data){
  let hasNew = false;
  Object.keys(data).forEach(sid => {
    const s = data[sid];
    const msgs = s.messages ? Object.values(s.messages) : [];
    const count = msgs.length;
    if(knownMsgCounts[sid] !== undefined && count > knownMsgCounts[sid]){
      const newMsgs = msgs.slice(knownMsgCounts[sid]);
      const fromVisitor = newMsgs.some(m=>m.sender==='visitor');
      if(fromVisitor && sid !== currentSid){
        hasNew = true;
        showToast(`💬 Νέο μήνυμα από ${s.visitorName||'Επισκέπτη'}`);
        playPing();
      }
    }
    knownMsgCounts[sid] = count;
  });
  document.getElementById('notif-badge').style.display = hasNew ? 'block' : 'none';
}

// ── OPEN SESSION ──────────────────────────
function openSession(sid){
  currentSid = sid;
  document.getElementById('chat-empty').style.display='none';
  document.getElementById('chat-active').style.display='flex';
  document.getElementById('notif-badge').style.display='none';

  // Mark as seen
  const msgsRef = db.ref(`chat/sessions/${sid}/messages`);
  msgsRef.once('value', snap => {
    const data = snap.val();
    if(data) Object.keys(data).forEach(k=>{
      if(data[k].sender==='visitor'&&!data[k].seen)
        msgsRef.child(k).update({seen:true});
    });
  });

  // Session info
  db.ref(`chat/sessions/${sid}`).once('value', snap => {
    const s = snap.val()||{};
    document.getElementById('ch-name').textContent = s.visitorName||'Επισκέπτης';
    document.getElementById('ch-page').textContent = s.page||'';
  });

  // Listen messages
  if(msgsListener) msgsListener();
  msgsListener = db.ref(`chat/sessions/${sid}/messages`).on('value', snap => {
    drawMsgs(snap.val());
  });

  document.getElementById('admin-inp').focus();
}

function drawMsgs(data){
  const box = document.getElementById('chat-msgs');
  if(!data){ box.innerHTML='<div style="text-align:center;color:var(--text3);font-size:13px;padding:40px">Δεν υπάρχουν μηνύματα</div>'; return; }
  const keys = Object.keys(data).sort();
  box.innerHTML = keys.map(k => {
    const m = data[k];
    const isAdmin = m.sender==='admin';
    return `<div class="msg ${isAdmin?'msg-admin':'msg-visitor'}">
      <div class="msg-sender">${isAdmin?'Εσύ':'Επισκέπτης'}</div>
      ${esc(m.text)}
      <span class="msg-time">${m.timestamp?fmtFull(m.timestamp):''}</span>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

// ── SEND REPLY ────────────────────────────
function sendReply(){
  if(!currentSid) return;
  const inp = document.getElementById('admin-inp');
  const t = inp.value.trim();
  if(!t) return;
  db.ref(`chat/sessions/${currentSid}/messages`).push({
    sender:'admin', text:t,
    timestamp: firebase.database.ServerValue.TIMESTAMP,
    seen:false
  });
  db.ref(`chat/sessions/${currentSid}`).update({
    lastActivity: firebase.database.ServerValue.TIMESTAMP,
    lastMessage: '← '+t.substring(0,80)
  });
  inp.value='';
  inp.style.height='auto';
  inp.focus();
}

// ── CLOSE SESSION ─────────────────────────
function closeSession(){
  if(!currentSid) return;
  if(!confirm('Κλείνεις αυτή τη συνομιλία;')) return;
  db.ref(`chat/sessions/${currentSid}`).update({active:false});
  currentSid=null;
  document.getElementById('chat-empty').style.display='flex';
  document.getElementById('chat-active').style.display='none';
}

// ── UTILS ─────────────────────────────────
function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML;}
function fmtTime(ts){return new Date(ts).toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'});}
function fmtFull(ts){return new Date(ts).toLocaleString('el-GR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3500);
}

let audioCtx;
function playPing(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=880;o.type='sine';
    g.gain.setValueAtTime(0.3,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.4);
    o.start();o.stop(audioCtx.currentTime+0.4);
  }catch(e){}
}

// Auto-resize textarea
document.getElementById('admin-inp').addEventListener('input',function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,120)+'px';
});
</script>
</body>
</html>
