<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweet Home 3D – Interactive Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&subset=greek,latin&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--soft:#f6faf9;--line:#e3ebe9;--ink:#1f2b2a;--ink2:#4a5652;--ink3:#7d8884;--teal:#2a8c82;--teal-d:#1f6b63;--teal-s:#e8f4f2;--coral:#d85a30;--coral-s:#fdece6;--coral-i:#993c1d;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',Arial,sans-serif;line-height:1.6;}
.app{max-width:1000px;margin:0 auto;padding:18px 16px 28px;}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
h1{font-size:clamp(1.2rem,3.4vw,1.7rem);margin:0;font-weight:800;}
h1 span{color:var(--teal);}
.lang{border:2px solid var(--teal);background:#fff;color:var(--teal-d);font-weight:700;border-radius:20px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:.9rem;}
.lang:hover{background:var(--teal-s);}
.sub{color:var(--ink3);font-size:.95rem;margin:0 0 16px;}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px;}
.progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s;}
.group-label{font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:10px 0 6px;}
.stepper{display:flex;flex-wrap:wrap;gap:8px;}
.step{flex:1 1 150px;min-width:140px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-family:inherit;color:var(--ink);transition:.15s;position:relative;}
.step:hover{border-color:var(--teal);transform:translateY(-1px);}
.step .n{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--teal-s);color:var(--teal-d);font-weight:800;font-size:.8rem;align-items:center;justify-content:center;margin-right:6px;}
.step .t{font-weight:700;font-size:.88rem;}
.step .ic{float:right;font-size:1.1rem;}
.step.active{border-color:var(--teal);background:var(--teal-s);box-shadow:0 4px 14px rgba(42,140,130,.18);}
.step.active .n{background:var(--teal);color:#fff;}
.step.done .n{background:var(--teal);color:#fff;}
.panel{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:18px;}
@media(max-width:820px){.panel{grid-template-columns:1fr;}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;}
.mock{background:var(--soft);}
.mock-h{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--ink3);font-weight:600;margin-bottom:8px;}
.live{background:var(--coral-s);color:var(--coral-i);font-weight:700;border-radius:12px;padding:2px 10px;font-size:.72rem;}
svg.m{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line);background:#fff;}
.hs{cursor:pointer;}
.hs circle{fill:var(--coral);stroke:#fff;stroke-width:2;transition:.15s;}
.hs text{fill:#fff;font-size:12px;font-weight:800;text-anchor:middle;pointer-events:none;}
.hs:hover circle,.hs.on circle{fill:var(--teal-d);r:14;}
.hs .pulse{fill:none;stroke:var(--coral);stroke-width:2;opacity:.6;animation:p 1.8s infinite;}
@keyframes p{0%{r:11;opacity:.7}100%{r:22;opacity:0}}
.callout{margin-top:10px;background:#fff;border-left:4px solid var(--coral);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.92rem;color:var(--ink2);min-height:48px;}
.callout b{color:var(--ink);}
.info h2{margin:0 0 4px;font-size:1.25rem;font-weight:800;}
.info .tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--coral-s);color:var(--coral-i);padding:3px 10px;border-radius:14px;margin-bottom:8px;}
.info p{color:var(--ink2);margin:8px 0;}
.info h3{font-size:.95rem;color:var(--teal-d);margin:16px 0 6px;}
.tips{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px;}
.tips li{background:var(--teal-s);border-radius:8px;padding:8px 12px;font-size:.9rem;color:var(--ink2);}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-family:inherit;cursor:pointer;font-size:.92rem;}
.btn.p{background:var(--teal);color:#fff;}
.btn.p:hover{background:var(--teal-d);}
.btn.s{background:#fff;border:1.5px solid var(--line);color:var(--ink2);}
.btn.s:hover{border-color:var(--teal);}
.btn:disabled{opacity:.4;cursor:default;}
.foot{margin-top:22px;text-align:center;font-size:.85rem;color:var(--ink3);}
.foot a{color:var(--teal-d);font-weight:600;text-decoration:none;}
</style>
</head>

         '<polygon points="'+pts([a,d,dt,at])+'" fill="'+c+'" opacity=".65"/>'+
         '<polygon points="'+pts([at,bt,ct,dt])+'" fill="'+c+'"/>';
}

/* ---------- Render ---------- */
function renderStepper(){
  var h='',lastG='';
  S.forEach(function(s,i){
    if(s.g!==lastG){h+=(lastG?'</div>':'')+'<div class="group-label">'+UI[lang][s.g]+'</div><div class="stepper">';lastG=s.g;}
    h+='<button class="step'+(i===cur?' active':'')+(i<cur?' done':'')+'" data-i="'+i+'"><span class="ic">'+s.ic+'</span><span class="n">'+(i+1)+'</span><span class="t">'+L(s.t)+'</span></button>';
  });
  document.getElementById('stepper').innerHTML=h+'</div>';
  document.querySelectorAll('.step').forEach(function(b){b.addEventListener('click',function(){go(+b.dataset.i);});});
}
function renderMock(){
  var s=S[cur];
  var svg='<svg class="m" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Inter,Arial,sans-serif">'+MOCK[s.mock]();
  s.hs.forEach(function(p,i){
    svg+='<g class="hs'+(i===hot?' on':'')+'" data-h="'+i+'"><circle class="pulse" cx="'+p.x+'" cy="'+p.y+'" r="11"/><circle cx="'+p.x+'" cy="'+p.y+'" r="11"/><text x="'+p.x+'" y="'+(p.y+4)+'">'+(i+1)+'</text></g>';
  });
  svg+='</svg>';
  document.getElementById('mockBox').innerHTML=svg;
  document.querySelectorAll('.hs').forEach(function(g){g.addEventListener('click',function(){hot=+g.dataset.h;renderMock();renderCallout();});});
}
function renderCallout(){
  var s=S[cur],c=document.getElementById('callout');
  c.innerHTML=(hot>=0&&s.hs[hot])?('<b>'+(hot+1)+'.</b> '+L(s.hs[hot])):UI[lang].hint;
}
function renderInfo(){
  var s=S[cur],u=UI[lang];
  var h='<span class="tag">'+u.step+' '+(cur+1)+' '+u.of+' '+S.length+'</span><h2>'+s.ic+' '+L(s.t)+'</h2><p>'+L(s.d)+'</p><h3>'+u.tips+'</h3><ul class="tips">'+L(s.tips).map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul>';
  document.getElementById('info').innerHTML=h;
}
function renderChrome(){
  var u=UI[lang];
  document.documentElement.lang=lang;
  document.getElementById('ttl').textContent=u.ttl;
  document.getElementById('sub').textContent=u.sub;
  document.getElementById('mockTitle').textContent=u.mock;
  document.getElementById('prev').textContent=u.prev;
  document.getElementById('next').textContent=u.next;
  document.getElementById('artLink').textContent=u.art;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===S.length-1;
  document.getElementById('bar').style.width=((cur+1)/S.length*100)+'%';
}
function render(){renderChrome();renderStepper();renderMock();renderCallout();renderInfo();}
function go(i){cur=Math.max(0,Math.min(S.length-1,i));hot=0;render();}
document.getElementById('prev').addEventListener('click',function(){go(cur-1);});
document.getElementById('next').addEventListener('click',function(){go(cur+1);});
document.getElementById('langBtn').addEventListener('click',function(){lang=lang==='el'?'en':'el';render();});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
render();
</script>
