
<style>
  h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff}
  .wrap{max-width:660px;margin:0 auto;padding:2rem 1rem}
  .header{text-align:center;margin-bottom:1.8rem}
  .header h1{font-size:20px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px}
  .header p{font-size:14px;color:var(--color-text-secondary)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:14px 16px;cursor:pointer;transition:border-color 0.15s,background 0.15s;position:relative}
  .card:hover{border-color:var(--color-border-secondary);background:var(--color-background-secondary)}
  .card.active{border:2px solid #1D9E75;background:var(--color-background-primary)}
  .card-top{display:flex;align-items:center;gap:10px}
  .num{width:28px;height:28px;border-radius:50%;background:#E1F5EE;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#085041;flex-shrink:0}
  .card.active .num{background:#1D9E75;color:#fff}
  .card-title{font-size:14px;font-weight:500;color:var(--color-text-primary);line-height:1.3}
  .chevron{margin-left:auto;color:var(--color-text-secondary);font-size:16px;transition:transform 0.2s}
  .card.active .chevron{transform:rotate(180deg);color:#1D9E75}
  .detail{overflow:hidden;max-height:0;transition:max-height 0.3s ease,padding 0.2s}
  .card.active .detail{max-height:200px;padding-top:12px}
  .detail p{font-size:13px;color:var(--color-text-secondary);line-height:1.6;border-left:3px solid #1D9E75;padding-left:10px}
  .tip-badge{display:inline-block;margin-top:8px;font-size:11px;padding:3px 9px;border-radius:20px;background:#E1F5EE;color:#085041;font-weight:500}
  .footer{margin-top:1.5rem;text-align:center;font-size:13px;color:var(--color-text-secondary)}
</style>

<div class="wrap">
  <h2 class="sr-only">Διαδραστικός οδηγός βελτιστοποίησης μνήμης RAM στα Windows — 10 συμβουλές με αναλυτικές πληροφορίες</h2>

  <div class="header">
    <h1><i class="ti ti-cpu" aria-hidden="true" style="font-size:20px;vertical-align:-2px;margin-right:6px;color:#1D9E75"></i>Βελτιστοποίηση μνήμης RAM στα Windows</h1>
    <p>Κάντε κλικ σε κάθε συμβουλή για αναλυτικές πληροφορίες</p>
  </div>

  <div class="grid" id="grid"></div>

  <div class="footer">
    <i class="ti ti-info-circle" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"></i>
    Εφαρμόστε τις συμβουλές διαδοχικά για καλύτερα αποτελέσματα
  </div>
</div>

<script>
const tips = [
  {
    title: "Κλείστε αχρησιμοποίητες εφαρμογές",
    detail: "Κάθε ανοιχτή εφαρμογή δεσμεύει μέρος της RAM, ακόμη και χωρίς ενεργή χρήση. Από τη Διαχείριση Εργασιών εντοπίστε εφαρμογές με υψηλή κατανάλωση και επιλέξτε «Τερματισμός Εργασίας».",
    tip: "Ctrl+Shift+Esc → Διαχείριση Εργασιών"
  },
  {
    title: "Περιορίστε εφαρμογές παρασκηνίου",
    detail: "Πολλές εφαρμογές λειτουργούν αθόρυβα στο παρασκήνιο, καταναλώνοντας μνήμη και επεξεργαστική ισχύ. Ελέγξτε και απενεργοποιήστε όσες δεν είναι απαραίτητες.",
    tip: "Ρυθμίσεις → Απόρρητο → Εφαρμογές παρασκηνίου"
  },
  {
    title: "Διαγράψτε προσωρινά αρχεία",
    detail: "Τα temp αρχεία συσσωρεύονται και επιβαρύνουν το σύστημα. Χρησιμοποιήστε το εργαλείο Εκκαθάρισης Δίσκου ή τις Ρυθμίσεις Αποθήκευσης των Windows.",
    tip: "Win+R → cleanmgr"
  },
  {
    title: "Ελέγξτε προγράμματα εκκίνησης",
    detail: "Πολλά προγράμματα εκκινούν αυτόματα με τα Windows χωρίς να χρειάζεται. Αυτό αυξάνει χρήση RAM και επιβραδύνει την εκκίνηση. Απενεργοποιήστε τα περιττά.",
    tip: "Διαχείριση Εργασιών → καρτέλα Εκκίνηση"
  },
  {
    title: "Διατηρείτε τα Windows ενημερωμένα",
    detail: "Οι ενημερώσεις περιλαμβάνουν διορθώσεις σφαλμάτων και βελτιώσεις στη διαχείριση μνήμης. Ορισμένες αναβαθμίσεις διορθώνουν προβλήματα αυξημένης κατανάλωσης RAM.",
    tip: "Ρυθμίσεις → Windows Update"
  },
  {
    title: "Απεγκαταστήστε αχρησιμοποίητες εφαρμογές",
    detail: "Παλιά προγράμματα μπορεί να εκτελούν υπηρεσίες στο παρασκήνιο χωρίς να το γνωρίζετε. Η αφαίρεσή τους μειώνει επιβάρυνση και απελευθερώνει χώρο.",
    tip: "Ρυθμίσεις → Εφαρμογές → Εγκατεστημένες"
  },
  {
    title: "Βελτιστοποιήστε την εικονική μνήμη",
    detail: "Το pagefile λειτουργεί ως εφεδρική μνήμη όταν η RAM εξαντλείται. Μπορείτε να ρυθμίσετε το μέγεθός του χειροκίνητα για καλύτερες επιδόσεις.",
    tip: "Αυτός ο Υπολογιστής → Ιδιότητες → Ρυθμίσεις Για Προχωρημένους"
  },
  {
    title: "Κάντε τακτικές επανεκκινήσεις",
    detail: "Η επανεκκίνηση απελευθερώνει πλήρως τη RAM και τερματίζει διεργασίες που παραμένουν ενεργές. Συνιστάται τουλάχιστον μία φορά την εβδομάδα.",
    tip: "Προτιμήστε Επανεκκίνηση αντί Αδρανοποίησης"
  },
  {
    title: "Μειώστε τα οπτικά εφέ",
    detail: "Τα εφέ κίνησης και οι διαφάνειες των Windows καταναλώνουν επιπλέον πόρους. Μεταβείτε στις ρυθμίσεις απόδοσης για να τα απενεργοποιήσετε.",
    tip: "Ρυθμίσεις Συστήματος → Απόδοση → Καλύτερη Απόδοση"
  },
  {
    title: "Αναβαθμίστε τη φυσική RAM",
    detail: "Αν ο υπολογιστής διαθέτει λιγότερα από 8 GB RAM και τρέχετε σύγχρονες εφαρμογές, η αναβάθμιση είναι η πιο αποτελεσματική λύση. Ελέγξτε πρώτα τη μητρική πλακέτα.",
    tip: "Τελική και πιο αποτελεσματική επιλογή"
  }
];

const grid = document.getElementById('grid');

tips.forEach((t, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-top">
      <div class="num">${i+1}</div>
      <div class="card-title">${t.title}</div>
      <i class="ti ti-chevron-down chevron" aria-hidden="true"></i>
    </div>
    <div class="detail">
      <p>${t.detail}</p>
      <span class="tip-badge"><i class="ti ti-terminal-2" aria-hidden="true" style="font-size:11px;vertical-align:-1px;margin-right:3px"></i>${t.tip}</span>
    </div>
  `;
  card.addEventListener('click', () => {
    const isActive = card.classList.contains('active');
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    if (!isActive) card.classList.add('active');
  });
  grid.appendChild(card);
});
</script>
