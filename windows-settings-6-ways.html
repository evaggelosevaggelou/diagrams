<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6 τρόποι για τις Ρυθμίσεις των Windows — Interactive</title>
<style>
:root{--ink:#1f2b2a;--ink2:#4a5652;--ink3:#7d8884;--line:#e6ecef;--blue:#0067c0;--blue-soft:#e8f1fb;--teal:#2a8c82;--teal-soft:#e8f4f2;--coral:#d85a30;--coral-soft:#fdece6;--amber:#c27a00;--amber-soft:#fff4dc}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55}
.app{max-width:900px;margin:0 auto;padding:14px 14px 22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:1.15rem;margin:0;font-weight:800;letter-spacing:-.2px}
.top h1 span{color:var(--blue)}
.lang{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--ink)}
.lang:hover{border-color:var(--blue);color:var(--blue)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{flex:1 1 auto;border:1px solid var(--line);background:#f7f9fb;border-radius:10px;padding:9px 12px;font-size:.88rem;font-weight:700;cursor:pointer;color:var(--ink2);text-align:center}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.panel{display:none}.panel.on{display:block}
.hint{color:var(--ink3);font-size:.88rem;margin:0 0 12px}
.cards{display:flex;flex-wrap:wrap;gap:10px}
.card{flex:1 1 130px;min-width:130px;border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit}
.card:hover{border-color:#b9d3ee}
.card.on{border-color:var(--blue);background:var(--blue-soft)}
.card .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:.85rem;align-items:center;justify-content:center;margin-bottom:6px}
.card .t{display:block;font-weight:700;font-size:.92rem;line-height:1.3}
.card .s{display:block;color:var(--ink3);font-size:.78rem;margin-top:3px}
.detail{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:18px;background:#fbfcfe}
.detail h2{margin:0 0 2px;font-size:1.3rem;letter-spacing:-.3px}
.detail .sub{color:var(--ink2);margin:0 0 12px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.badge{font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--blue-soft);color:#0b4a8f}
.badge.g{background:var(--teal-soft);color:#1f6b63}.badge.o{background:var(--amber-soft);color:#8a5600}.badge.r{background:var(--coral-soft);color:#993c1d}
.keys{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.key{min-width:58px;height:58px;padding:0 14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fff,#e8edf3);border:1px solid #c9d1da;border-bottom-width:5px;border-radius:12px;font-weight:800;font-size:1.05rem;box-shadow:0 6px 14px rgba(0,0,0,.12)}
.key.hot{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,103,192,.18),0 6px 14px rgba(0,0,0,.12)}
.plus{font-weight:800;color:var(--ink3);font-size:1.3rem}
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;margin:8px 0;cursor:pointer;opacity:.55}
.step .b{flex:none;width:28px;height:28px;border-radius:50%;background:#c7d3dd;color:#fff;font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.step.done{opacity:1}.step.done .b{background:var(--teal)}
.step.cur{opacity:1;border-color:var(--blue);background:var(--blue-soft)}.step.cur .b{background:var(--blue)}
.ctrl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;font-size:.88rem;padding:9px 16px;cursor:pointer}
.btn.gh{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btn:hover{filter:brightness(.95)}
.note{margin-top:12px;background:var(--coral-soft);border-left:4px solid var(--coral);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.92rem}
code,.cmd{font-family:ui-monospace,Consolas,"Courier New",monospace}
code{background:var(--teal-soft);color:#1f6b63;padding:1px 7px;border-radius:6px;font-weight:600;font-size:.9em}
.choose{display:flex;gap:10px;flex-wrap:wrap}
.opt{flex:1 1 200px;border:2px solid var(--line);border-radius:16px;padding:16px;background:#fff;text-align:center;cursor:pointer;font:inherit;color:inherit}
.opt:hover{border-color:#b9d3ee}.opt.on{border-color:var(--blue);background:var(--blue-soft)}
.opt .e{font-size:1.8rem;display:block}.opt b{display:block;margin-top:4px}.opt small{color:var(--ink3)}
.result{margin-top:14px;border-radius:14px;padding:16px;background:var(--teal-soft);border:1px solid #bfe0db;display:none}
.result.on{display:block}
.result h3{margin:0 0 4px;font-size:1.1rem}
.rows{margin-top:6px}
.row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff;flex-wrap:wrap}
.row .cmd{flex:1 1 220px;background:#14201f;color:#7ee787;border-radius:8px;padding:8px 12px;font-size:.88rem;word-break:break-all}
.row .what{flex:1 1 140px;font-weight:600}
.row .cp{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-weight:700;font-size:.8rem;cursor:pointer}
.row .cp.ok{background:var(--teal);border-color:var(--teal);color:#fff}
.fix{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:#fff}
.fix .num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--amber-soft);color:var(--amber);font-weight:800;display:flex;align-items:center;justify-content:center}
.fix .bd{flex:1;min-width:0}
.fix .bd b{display:block}
.foot{margin-top:16px;text-align:center;color:var(--ink3);font-size:.85rem}
.foot a{color:var(--blue);font-weight:600;text-decoration:none}
@media (max-width:560px){.app{padding:10px 10px 18px}.detail{padding:14px}.key{min-width:50px;height:50px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>⚙️ <span id="ttl"></span></h1>
    <button class="lang" id="langBtn" type="button">🌐 EN</button>
  </div>
  <div class="tabs" id="tabs"></div>

  <section class="panel on" id="p-ways">
    <p class="hint" id="hintWays"></p>
    <div class="cards" id="cards"></div>
    <div class="detail" id="detail"></div>
  </section>

  <section class="panel" id="p-pick">
    <p class="hint" id="hintPick"></p>
    <div class="choose" id="choose"></div>
    <div class="result" id="result"></div>
  </section>

  <section class="panel" id="p-bonus">
    <p class="hint" id="hintBonus"></p>
    <div class="keys"><div class="key">Win</div><span class="plus">+</span><div class="key">R</div></div>
    <div class="rows" id="rows"></div>
  </section>

  <section class="panel" id="p-fix">
    <p class="hint" id="hintFix"></p>
    <div id="fixes"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

var cur=0, stepIdx=0, tabIdx=0, pickIdx=-1;
function $(i){return document.getElementById(i);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderTabs(){
  var t=T[LANG].tabs,h='';
  for(var i=0;i<t.length;i++)h+='<button type="button" class="tab'+(i===tabIdx?' on':'')+'" data-t="'+i+'">'+esc(t[i])+'</button>';
  $('tabs').innerHTML=h;
  var ids=['p-ways','p-pick','p-bonus','p-fix'];
  for(var j=0;j<ids.length;j++)$(ids[j]).className='panel'+(j===tabIdx?' on':'');
}
function renderCards(){
  var w=T[LANG].ways,h='';
  for(var i=0;i<w.length;i++)h+='<button type="button" class="card'+(i===cur?' on':'')+'" data-w="'+i+'"><span class="n">'+(i+1)+'</span><span class="t">'+esc(w[i].t)+'</span><span class="s">'+esc(w[i].s)+'</span></button>';
  $('cards').innerHTML=h;
}
function renderDetail(){
  var L=T[LANG],w=L.ways[cur],h='';
  h+='<h2>'+(cur+1)+'. '+esc(w.t)+'</h2><p class="sub">'+esc(w.s)+'</p><div class="badges"><span class="badge o">⚡ '+L.speed+': '+w.sp+'</span>';
  for(var b=0;b<w.b.length;b++)h+='<span class="badge g">'+esc(w.b[b])+'</span>';
  h+='</div>';
  if(w.keys.length){
    h+='<div class="keys">';
    for(var k=0;k<w.keys.length;k++){h+=(k?'<span class="plus">+</span>':'')+'<div class="key hot">'+esc(w.keys[k])+'</div>';}
    h+='</div>';
  }
  h+='<ol class="steps">';
  for(var s=0;s<w.st.length;s++){
    var c=s<stepIdx?'done':(s===stepIdx?'cur':'');
    h+='<li class="step '+c+'" data-s="'+s+'"><span class="b">'+(s<stepIdx?'✓':(s+1))+'</span><span>'+esc(w.st[s])+'</span></li>';
  }
  h+='</ol><div class="ctrl">';
  if(stepIdx<w.st.length)h+='<button type="button" class="btn" id="nx">'+L.next+' →</button>';
  else h+='<span class="badge g">✅ '+L.finished+'</span>';
  h+='<button type="button" class="btn gh" id="rs">↺ '+L.reset+'</button></div>';
  h+='<div class="note"><strong>💡</strong> '+esc(w.note)+'</div>';
  $('detail').innerHTML=h;
}
function renderPick(){
  var L=T[LANG],h='';
  for(var i=0;i<L.pick.length;i++){var p=L.pick[i];h+='<button type="button" class="opt'+(i===pickIdx?' on':'')+'" data-p="'+i+'"><span class="e">'+p.e+'</span><b>'+esc(p.t)+'</b><small>'+esc(p.d)+'</small></button>';}
  $('choose').innerHTML=h;
  var r=$('result');
  if(pickIdx<0){r.className='result';r.innerHTML='';return;}
  var q=L.pick[pickIdx];
  r.className='result on';
  r.innerHTML='<h3>'+esc(L.ways[q.w].t)+'</h3><p style="margin:0 0 10px">'+esc(q.why)+'</p><button type="button" class="btn" id="goW" data-w="'+q.w+'">'+L.go+' →</button>';
}
function renderBonus(){
  var L=T[LANG],h='';
  for(var i=0;i<L.bonus.length;i++)h+='<div class="row"><div class="cmd">'+esc(L.bonus[i][0])+'</div><div class="what">→ '+esc(L.bonus[i][1])+'</div><button type="button" class="cp" data-c="'+esc(L.bonus[i][0])+'">'+L.copy+'</button></div>';
  $('rows').innerHTML=h;
}
function renderFix(){
  var L=T[LANG],h='';
  for(var i=0;i<L.fixes.length;i++){
    var f=L.fixes[i];
    h+='<div class="fix"><div class="num">'+(i+1)+'</div><div class="bd"><b>'+esc(f.t)+'</b><span style="color:var(--ink2)">'+esc(f.d)+'</span>';
    if(f.c)h+='<div class="row" style="margin-bottom:0"><div class="cmd">'+esc(f.c)+'</div><button type="button" class="cp" data-c="'+esc(f.c)+'">'+L.copy+'</button></div>';
    h+='</div></div>';
  }
  h+='<div class="note">⚠️ '+esc(L.fixnote)+'</div>';
  $('fixes').innerHTML=h;
}
function renderAll(){
  var L=T[LANG];
  document.documentElement.lang=LANG;
  $('ttl').textContent=L.ttl;
  $('langBtn').textContent=LANG==='el'?'🌐 EN':'🌐 ΕΛ';
  $('hintWays').textContent=L.hintWays;$('hintPick').textContent=L.hintPick;$('hintBonus').textContent=L.hintBonus;$('hintFix').textContent=L.hintFix;
  $('foot').innerHTML=L.foot;
  renderTabs();renderCards();renderDetail();renderPick();renderBonus();renderFix();
}
function copyText(txt,btn){
  var done=function(){var o=btn.textContent;btn.textContent=T[LANG].copied;btn.className+=' ok';setTimeout(function(){btn.textContent=T[LANG].copy;btn.className=btn.className.replace(' ok','');},1400);};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallback();});return;}
  }catch(e){}
  fallback();
  function fallback(){try{var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done();}catch(e){}}
}

document.addEventListener('click',function(e){
  var el=e.target;
  while(el&&el!==document&&!(el.getAttribute&&(el.getAttribute('data-t')||el.getAttribute('data-w')||el.getAttribute('data-p')||el.getAttribute('data-c')||el.getAttribute('data-s')||el.id==='nx'||el.id==='rs'||el.id==='langBtn')))el=el.parentNode;
  if(!el||el===document)return;
  var w=T[LANG].ways[cur];
  if(el.id==='langBtn'){LANG=LANG==='el'?'en':'el';try{localStorage.setItem('lft-win-lang',LANG);}catch(x){}renderAll();return;}
  if(el.id==='nx'){if(stepIdx<w.st.length)stepIdx++;renderDetail();return;}
  if(el.id==='rs'){stepIdx=0;renderDetail();return;}
  if(el.hasAttribute('data-t')){tabIdx=+el.getAttribute('data-t');renderTabs();return;}
  if(el.hasAttribute('data-p')){pickIdx=+el.getAttribute('data-p');renderPick();return;}
  if(el.hasAttribute('data-c')){copyText(el.getAttribute('data-c'),el);return;}
  if(el.hasAttribute('data-s')){stepIdx=+el.getAttribute('data-s');renderDetail();return;}
  if(el.hasAttribute('data-w')){cur=+el.getAttribute('data-w');stepIdx=0;tabIdx=0;renderTabs();renderCards();renderDetail();return;}
});
renderAll();
})();
</script>
</body>
</html>
