<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Smart TV Privacy Checker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#1a202c;padding:0}

/* ── Lang toggle ── */
.lang-bar{display:flex;justify-content:flex-end;padding:10px 16px 0;gap:6px}
.lang-btn{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;border:1.5px solid #cbd5e1;background:#fff;color:#64748b;cursor:pointer;transition:all .15s}
.lang-btn.active{background:#1e4d6b;border-color:#1e4d6b;color:#fff}

/* ── Wrapper ── */
.wrap{padding:1.25rem 1.25rem 1.5rem}
.intro{font-size:14px;color:#64748b;margin-bottom:1.25rem;line-height:1.6}
.section-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:#94a3b8;text-transform:uppercase;margin-bottom:8px}

/* ── Brand grid ── */
.brand-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:1.5rem}
.brand-btn{padding:10px 8px;border:1.5px solid #e2e8f0;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:#64748b;transition:all .15s;text-align:center;line-height:1.3}
.brand-btn:hover{background:#f8fafc;color:#1a202c;border-color:#cbd5e1}
.brand-btn.active{border:2px solid #1e4d6b;background:#eef3f8;color:#1e4d6b}
.brand-btn i{display:block;font-size:20px;margin-bottom:4px}

/* ── Progress ── */
.progress-label{font-size:13px;color:#64748b;margin-bottom:6px}
.progress-bar{height:6px;border-radius:3px;background:#e2e8f0;margin-bottom:1.25rem;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:#1D9E75;transition:width .3s}

/* ── Steps ── */
.step-list{display:flex;flex-direction:column;gap:10px}
.step-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1.5px solid #f1f5f9;border-radius:8px;background:#fff;cursor:pointer;transition:all .15s}
.step-item:hover{border-color:#e2e8f0}
.step-item.checked{border-color:#1D9E75;background:#E1F5EE}
.step-check{width:20px;height:20px;min-width:20px;border-radius:50%;border:1.5px solid #cbd5e1;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:2px;flex-shrink:0}
.step-item.checked .step-check{background:#1D9E75;border-color:#1D9E75}
.step-title{font-size:14px;font-weight:500;color:#1a202c;margin-bottom:3px}
.step-path{font-size:12px;color:#64748b;font-family:ui-monospace,'Cascadia Code','Courier New',monospace;line-height:1.5}
.step-item.checked .step-title{color:#085041}
.step-item.checked .step-path{color:#0F6E56}

/* ── Done badge ── */
.done-badge{display:inline-flex;align-items:center;gap:6px;margin-top:1rem;padding:8px 16px;background:#E1F5EE;color:#085041;border-radius:8px;font-size:13px;font-weight:600}
.done-badge i{font-size:16px}
</style>
</head>
<body>

<div class="lang-bar">
 <button class="lang-btn active" onclick="setLang('en')" id="btn-en">🌐 EN</button>
 
</div>

<div class="wrap">
 <p class="intro" id="intro-text">Select your TV brand, then check off each setting as you disable it.</p>

 <div class="section-label" id="label-brand">Select your brand</div>
 <div class="brand-grid" id="brands">
 <button class="brand-btn" data-brand="samsung" onclick="selectBrand('samsung')">
 <i class="ti ti-device-tv" aria-hidden="true"></i>Samsung
 </button>
 <button class="brand-btn" data-brand="lg" onclick="selectBrand('lg')">
 <i class="ti ti-device-tv" aria-hidden="true"></i>LG
 </button>
 <button class="brand-btn" data-brand="sony" onclick="selectBrand('sony')">
 <i class="ti ti-device-tv" aria-hidden="true"></i>Sony / Android TV
 </button>
 <button class="brand-btn" data-brand="roku" onclick="selectBrand('roku')">
 <i class="ti ti-device-tv" aria-hidden="true"></i>TCL / Roku
 </button>
 </div>

 <div id="checklist-area" style="display:none">
 <div class="section-label" id="brand-label"></div>
 <div class="progress-label" id="progress-label"></div>
 <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
 <div class="step-list" id="steps"></div>
 <div id="done-msg" style="display:none">
 <span class="done-badge"><i class="ti ti-shield-check"></i><span id="done-text">All tracking disabled — well done!</span></span>
 </div>
 </div>
</div>

<script>
const strings = {
 en: {
 intro: "Select your TV brand, then check off each setting as you disable it.",
 selectBrand: "Select your brand",
 progressOf: (a,b) => a + " of " + b + " settings disabled",
 done: "All tracking disabled — well done!"
 },
 el: {
 intro: " .",
 selectBrand: " ",
 progressOf: (a,b) => a + " " + b + " ",
 done: " — !"
 }
};

const data = {
 samsung: {
 en: {
 label: "Samsung (Tizen OS)",
 steps: [
 {title:"Disable ACR (Viewing Information Services)", path:"Settings → Support → Terms & Privacy → Viewing Information Services → Off"},
 {title:"Disable interest-based advertising", path:"Settings → Support → Terms & Privacy → Interest-Based Advertisement Services → Off"},
 {title:"Disable Bixby voice wake-up", path:"Settings → General → Voice → Bixby Voice Settings → disable Voice Wake-up"},
 {title:"Review personalisation & opt-out options", path:"Settings → Support → Terms & Privacy → Samsung Privacy Notice → scroll to bottom"}
 ]
 },
 el: {
 label: "Samsung (Tizen OS)",
 steps: [
 {title:" ACR ( )", path:" → → & → → ."},
 {title:" ", path:" → → & → → ."},
 {title:" Bixby", path:" → → → Bixby → . "},
 {title:" & ", path:" → → & → Samsung → "}
 ]
 }
 },
 lg: {
 en: {
 label: "LG (webOS)",
 steps: [
 {title:"Disable ACR (Live Plus)", path:"Settings → All Settings → General → Live Plus → Off"},
 {title:"Disable personalised advertising", path:"Settings → All Settings → General → About This TV → User Agreements → Personalized Advertising → Off"},
 {title:"Reset the advertising identifier", path:"Settings → All Settings → General → Additional Settings → Advertising → Reset Ad ID"},
 {title:"Disable voice & motion recognition", path:"Settings → All Settings → General → AI Service → Voice & Motion Recognition → Off"}
 ]
 },
 el: {
 label: "LG (webOS)",
 steps: [
 {title:" ACR (Live Plus)", path:" → → → Live Plus → ."},
 {title:" ", path:" → → → TV → → . → ."},
 {title:" ", path:" → → → → → Ad ID"},
 {title:" & ", path:" → → → AI → & → ."}
 ]
 }
 },
 sony: {
 en: {
 label: "Sony / Android TV / Google TV",
 steps: [
 {title:"Disable Samba Interactive TV (ACR)", path:"Settings → Device Preferences → Samba Interactive TV → Off"},
 {title:"Opt out of ads personalisation (Android TV)", path:"Settings → Device Preferences → About → Ads → Opt out of Ads Personalisation → On"},
 {title:"Opt out of ads personalisation (Google TV)", path:"Settings → Privacy → Ads → Opt out of Ads Personalisation"},
 {title:"Disable usage & diagnostics data", path:"Settings → Device Preferences → Usage & Diagnostics → Off"}
 ]
 },
 el: {
 label: "Sony / Android TV / Google TV",
 steps: [
 {title:" Samba Interactive TV (ACR)", path:" → → Samba Interactive TV → ."},
 {title:" . (Android TV)", path:" → → → → . → ."},
 {title:" . (Google TV)", path:" → → → . "},
 {title:" & ", path:" → → & → ."}
 ]
 }
 },
 roku: {
 en: {
 label: "TCL / Roku OS",
 steps: [
 {title:"Disable ACR tracking", path:"Settings → Privacy → Smart TV Experience → uncheck Use Info from TV Inputs"},
 {title:"Limit advertising tracking", path:"Settings → Privacy → Advertising → Limit Ad Tracking → On, then reset Ad ID"},
 {title:"Disable microphone access", path:"Settings → Privacy → Microphone → Off"},
 {title:"Disable channel usage analytics", path:"Settings → Privacy → Channel Usage Data → uncheck"}
 ]
 },
 el: {
 label: "TCL / Roku OS",
 steps: [
 {title:" ACR", path:" → → Smart TV → « TV»"},
 {title:" ", path:" → → → → ., Ad ID"},
 {title:" ", path:" → → → ."},
 {title:" ", path:" → → → "}
 ]
 }
 }
};

let lang = 'en';
let current = null;
let checked = {};

function setLang(l) {
 lang = l;
 document.getElementById('btn-en').classList.toggle('active', l==='en');
 document.getElementById('btn-el').classList.toggle('active', l==='el');
 document.getElementById('intro-text').textContent = strings[l].intro;
 document.getElementById('label-brand').textContent = strings[l].selectBrand;
 if (current) render();
}

function selectBrand(b) {
 current = b;
 checked = {};
 document.querySelectorAll('.brand-btn').forEach(el => el.classList.toggle('active', el.dataset.brand === b));
 document.getElementById('checklist-area').style.display = 'block';
 document.getElementById('done-msg').style.display = 'none';
 render();
}

function toggle(i) {
 checked[i] = !checked[i];
 render();
}

function render() {
 const d = data[current][lang];
 document.getElementById('brand-label').textContent = d.label;
 const count = Object.values(checked).filter(Boolean).length;
 const total = d.steps.length;
 document.getElementById('progress-label').textContent = strings[lang].progressOf(count, total);
 document.getElementById('progress-fill').style.width = Math.round((count/total)*100) + '%';
 const list = document.getElementById('steps');
 list.innerHTML = d.steps.map((s,i) => `
 <div class="step-item${checked[i]?' checked':''}" onclick="toggle(${i})" role="checkbox" aria-checked="${!!checked[i]}" tabindex="0">
 <div class="step-check">${checked[i]?'<i class="ti ti-check" style="font-size:12px;color:#fff" aria-hidden="true"></i>':''}</div>
 <div>
 <div class="step-title">${s.title}</div>
 <div class="step-path">${s.path}</div>
 </div>
 </div>
 `).join('');
 document.getElementById('done-text').textContent = strings[lang].done;
 document.getElementById('done-msg').style.display = count === total ? 'block' : 'none';
}

document.addEventListener('keydown', e => {
 if(e.key === 'Enter' && e.target.classList.contains('step-item')) e.target.click();
});
</script>
</body>
</html>
